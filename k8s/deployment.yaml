apiVersion: v1
kind: Namespace
metadata:
  name: chaos-demo
  labels:
    purpose: resilience-testing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resilience-demo-nginx
  namespace: chaos-demo
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        location / {
            root  /usr/share/nginx/html;
            index index.html index.htm;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-demo
  namespace: chaos-demo
  labels:
    app: resilience-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resilience-demo
  template:
    metadata:
      labels:
        app: resilience-demo
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: resilience-demo-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-demo-svc
  namespace: chaos-demo
  labels:
    app: resilience-demo
spec:
  type: ClusterIP
  selector:
    app: resilience-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
